[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genre-lens"
version = "0.1.0"
description = "Music genre classification from audio features (MFCC, chroma, spectral) with a reproducible ML pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tobias Hellmann" }]
dependencies = [
    "numpy",
    "pandas",
    "librosa",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
