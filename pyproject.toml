[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genre-lens"
version = "0.1.0"
description = "Music genre classification from audio features (MFCC, chroma, spectral) with a reproducible ML pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tobias Hellmann" }]
dependencies = [
    "numpy",
    "pandas",
    "librosa",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "pyyaml",
    "pyarrow",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint."messages control"]
# Style opinions that clash with common ML/pytest conventions; ruff is the project linter.
disable = [
    "redefined-outer-name",         # pytest fixtures are passed in under their own name
    "invalid-name",                 # X / X_train is the scikit-learn convention
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
]
